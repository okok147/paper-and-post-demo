<!doctype html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f2e9"><meta name="description" content="在黑白手繪的小小庭院，替朋友找回散落的信。可探索的 2.5D 紙上世界。"><title>紙間小徑 · Paper & Post</title><link rel="stylesheet" href="style-f90040a35fca.css"></head>
<body>
<canvas id="world" tabindex="0" aria-label="紙間小徑遊戲，使用方向鍵或 WASD 移動、E 互動，也可以點選地面"></canvas>
<header><div class="eyebrow"><span class="ink-dot"></span> 一個可走進去的速寫本 <span class="edition">NO. 002</span></div><h1>紙間小徑<span>Paper &amp; Post</span></h1><p class="intro">有些話，走一小段路就能送到。</p></header>
<aside class="quest" aria-label="送信進度"><div class="quest-top"><span>今日的小事</span><span id="progress">0 / 3</span></div><p id="quest-text">找回散落的信，送給三位朋友。</p><div class="stamps" id="stamps"><span title="阿苔的花朵信">✿</span><span title="墨墨的月亮信">☾</span><span title="小豆的星星信">☆</span></div></aside>
<div class="toolbar"><button id="camera-toggle" aria-expanded="false" aria-controls="camera-panel">◈ <span>鏡頭筆記</span></button><button id="sound-toggle" aria-pressed="false" title="開啟聲音">♪ <span>聲音關閉</span></button></div>
<section id="camera-panel" hidden><div class="panel-title">一張紙，也有遠近。<button id="camera-close" aria-label="關閉鏡頭筆記">×</button></div><p>弱透視鏡頭 · 手繪逐格步行 · 深度遮擋</p><label>俯視角度 <output id="angle-value">30°</output><input id="angle" type="range" min="22" max="45" value="30"></label><label>鏡頭距離 <output id="zoom-value">100%</output><input id="zoom" type="range" min="80" max="125" value="100"></label><label class="check"><input id="follow" type="checkbox" checked> 輕輕跟隨角色</label><label class="check"><input id="perspective" type="checkbox" checked> 近大遠小的空間深度</label><button id="camera-reset">還原構圖</button></section>
<div id="location">THE LETTER GARDEN<span>信件花園</span></div>
<div id="hint" role="status" aria-live="polite">先走走看。草叢裡，好像有信。</div>
<button id="interact" hidden><span id="interact-icon">E</span><span id="interact-label">拾起信件</span></button>
<section id="dialogue" hidden aria-label="朋友的話"><div class="dialogue-top"><span id="speaker"></span><button id="dialogue-close" aria-label="關閉對話">×</button></div><p id="dialogue-text"></p><button id="dialogue-next">把話放進心裡 ↗</button></section>
<section id="ending" hidden><span class="eyebrow">今日郵差，任務完成。</span><h2>信送到了。<br>朋友也近了一點。</h2><p>一座很小的花園，裝得下三次相遇。<br>你仍可以留下來，慢慢走一會。</p><button id="keep-walking">再散步一下 ↗</button><button id="restart">重新送信</button></section>
<div class="touch-pad" aria-label="觸控方向"><button data-key="ArrowUp" aria-label="向後走">↑</button><button data-key="ArrowLeft" aria-label="向左走">←</button><button data-key="ArrowDown" aria-label="向前走">↓</button><button data-key="ArrowRight" aria-label="向右走">→</button></div>
<footer><div class="keys"><kbd>W A S D</kbd><span>或方向鍵移動</span><kbd>E</kbd><span>交談 / 拾取</span><span class="sep">/</span><span>點地面也能走</span></div><div class="footer-note">小小的路，慢慢地走。<span>2.5D STUDY — INK ON PAPER</span></div></footer>
<script src="game-f4292cd4092d.js"></script></body></html>
